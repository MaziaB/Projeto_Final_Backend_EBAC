name: CI/CD - FastAPI PokeAPI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Testes e Qualidade de Código
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      URL: "https://pokeapi.co/api/v2/pokemon/"
      DATABASE_URL: "sqlite:///./test_pokemon.db"
      MEU_USUARIO: "admin"
      MINHA_SENHA: "admin"
      REDIS_HOST: "localhost"
      REDIS_PORT: "6379"

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.4.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache de dependências do Poetry
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Instalar dependências
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Executar testes com Pytest
        run: poetry run pytest --cov=.

  docker-build:
    name: Validar Build do Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Testar build da imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pokemons-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
